        }

            color: white;

            font-size: 12px;
        }
        .email{

        .profile-pic{
            border-radius: 50%;

        }
        .bottom > div{
            display: inline-block;
            vertical-align: middle;
        }
        ul li:hover{
            background-color: rgb(89, 184, 248);
        }
