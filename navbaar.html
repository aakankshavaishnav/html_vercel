<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background-color: #F5EDE0;
        }

        nav div {
            font-size: 25px;
            font-weight: bold;
            color: #543D2E;
        }

        ul {
            display: flex;
            gap: 30px;
            list-style: none;
        }

        li a {
            text-decoration: none;
            color: #543D2E;
            font-size: 16px;
        }  li a {
            text-decoration: none;
            color: #543D2E;
            font-size: 16px;
        }

        .right-side {
            display: flex;
            gap: 10px;
        }

        button {
            padding: 10px 20px;
            border: 1px solid #543D2E;
            border-radius: 20px;
            background-color: transparent;
            color: #543D2E;
        }
    </style>
</head>
<body>
    <nav>
        <div>logo</div>
        <ul>
            <li><a href="">Home</a></li>
            <li><a href="">About</a></li>
            <li><a href="">Services</a></li>
            <li><a href="">Contact</a></li>
        </ul>
        <div class="right-side">
            <button>login</button>
            <button>sign up</button>
        </div>
    </nav>
</body>
</html>
